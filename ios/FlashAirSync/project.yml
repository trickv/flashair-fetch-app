# XcodeGen project definition.
#
# To generate FlashAirSync.xcodeproj:
#   brew install xcodegen
#   cd ios/FlashAirSync && xcodegen generate
#
# The generated .xcodeproj is intentionally NOT committed — regenerate
# from this file. Change targets/settings here, not in Xcode's UI.
#
# Before first build:
#   1. Open FlashAirSync.xcodeproj in Xcode.
#   2. Select the FlashAirSync target → Signing & Capabilities → set "Team"
#      to your Apple Developer team. Without this, the build will fail
#      with a "Signing for FlashAirSync requires a development team" error.
#   3. (Optional) Change PRODUCT_BUNDLE_IDENTIFIER below if `com.flashairsync`
#      conflicts with another app in your Apple Developer account.
#
# Hotspot Configuration entitlement: declared in FlashAirSync.entitlements.
# Requires Apple approval per app — request via the "Network Extensions"
# / "Hotspot Configuration" capability in Apple Developer Portal before
# submitting to TestFlight/App Store. Local development works without it.

name: FlashAirSync

options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

# SPM dependencies. XcodeGen resolves these via Xcode's package manager
# on `xcodegen generate`; the lock data lives in Package.resolved inside
# the generated .xcodeproj (which is gitignored — Sentry's version is
# pinned via the `from:` floor below).
packages:
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: "9.15.0"

# Explicit scheme definitions. Required since the `packages:` block above
# was added — XcodeGen no longer auto-creates schemes for projects with
# SPM dependencies in some versions, and an explicit declaration avoids
# the "project contains no schemes" failure mode.
schemes:
  FlashAirSync:
    build:
      targets:
        FlashAirSync: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FlashAirSyncTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    # Set DEVELOPMENT_TEAM in Xcode's Signing & Capabilities tab —
    # don't commit your team ID here.

targets:
  FlashAirSync:
    type: application
    platform: iOS
    sources:
      - path: FlashAirSync
        excludes:
          - "Info.plist"
          - "FlashAirSync.entitlements"
    dependencies:
      - package: Sentry
        product: Sentry
    info:
      path: FlashAirSync/Info.plist
      # Source of truth for Info.plist. XcodeGen regenerates the file from
      # these keys on every `xcodegen generate` — DO NOT hand-edit the plist,
      # it will be clobbered. CFBundle* keys are supplied by XcodeGen defaults.
      properties:
        CFBundleDisplayName: FlashAir Sync
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryAddUsageDescription: FlashAir Sync needs access to save photos and videos imported from your FlashAir SD card.
        NSPhotoLibraryUsageDescription: FlashAir Sync needs access to save photos and videos imported from your FlashAir SD card.
        NSLocalNetworkUsageDescription: FlashAir Sync needs to connect to your FlashAir SD card over local Wi-Fi.
        # FlashAir (and the local mock server) speak cleartext HTTP. ATS blocks
        # that by default. NSAllowsLocalNetworking permits cleartext to localhost,
        # .local, and IP literals (covers both the mock at localhost:8080 and the
        # real card at 192.168.0.1) without opening arbitrary internet cleartext.
        # iOS analog of Android's network_security_config cleartext whitelist.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Sentry DSN. Read at startup by Telemetry.startIfEnabled() and only
        # used when the user opts in via Settings -> Privacy. The DSN is
        # public per Sentry's own docs ("safe to include in source code");
        # it identifies the destination project, not a secret credential.
        SentryDSN: https://fcc743bcc1e56d3f3d852fa8d2ae09fc@o4510950028279809.ingest.us.sentry.io/4511510747676672
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flashairsync
        PRODUCT_NAME: FlashAirSync
        CODE_SIGN_ENTITLEMENTS: FlashAirSync/FlashAirSync.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"  # iPhone + iPad
        SUPPORTS_MACCATALYST: false
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

  FlashAirSyncTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FlashAirSyncTests
    dependencies:
      - target: FlashAirSync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flashairsync.tests
        # Let Xcode synthesize the test bundle's Info.plist (Apple-recommended);
        # without this the test target can't code-sign and `xcodebuild test` fails.
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FlashAirSync.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/FlashAirSync"
