name: CI

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
    branches: [ main ]

jobs:
  android-build:
    name: Android Build & Test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      working-directory: ./android
      run: chmod +x gradlew

    - name: Build with Gradle
      working-directory: ./android
      run: ./gradlew assembleDebug

    - name: Run unit tests
      working-directory: ./android
      run: ./gradlew test

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk

  mock-server-test:
    name: Test Mock FlashAir Server
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3

    - name: Start mock server
      working-directory: ./tools/mock-flashair
      run: |
        uv run server.py &
        # Wait until the server is actually listening (uv may need to resolve deps first).
        for i in {1..30}; do
          if curl -sf http://localhost:8080/ >/dev/null; then
            echo "Mock server up after ${i}s"
            exit 0
          fi
          sleep 1
        done
        echo "Mock server failed to start within 30s" >&2
        exit 1

    - name: Test CSV endpoint
      run: curl -fsS 'http://localhost:8080/command.cgi?op=100&DIR=/DCIM' -o /dev/null

    - name: Test config endpoint
      run: curl -fsS 'http://localhost:8080/command.cgi?op=104' -o /dev/null

  lint:
    name: Lint Check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      working-directory: ./android
      run: chmod +x gradlew

    - name: Run Android Lint
      working-directory: ./android
      run: ./gradlew lint
      continue-on-error: true  # Don't fail build on lint warnings (M1 scaffold)
